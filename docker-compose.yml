services:
  # DATABASE
  database:
    image: postgres:18.3-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - moviePlanet-network
    volumes:
      - postgres-data:/var/lib/postgresql
  
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - moviePlanet-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - database

networks:
  moviePlanet-network:
    driver: bridge
  
volumes:
  postgres-data:
  pgadmin-data: