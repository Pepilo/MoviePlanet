<div class="user-card">
    <form>
        <label for="login">Identifiant</label>
        <input
        type="text"
        id="login"
        required
        />

        <label for="email">Adresse mail</label>
        <input
        type="email"
        id="email"
        required
        readonly
        />

        <label for="password">Mot de passe</label>
        <input
        type="text"
        id="password"
        required
        readonly
        />
        
        <button type="submit">Créer l'utilisateur</button>
        <button (click)="onDelete()">Supprimer l'utilisateur</button>
    </form>
</div>
